<div class="flex flex-col gap-0.5">
  <span class="text-[10px] uppercase tracking-wide text-[#6B7B78]">{{ label }}</span>
  {% if valor %}
  <span class="text-xs sm:text-sm text-ink">{{ valor }}</span>
  {% else %}
  <span class="text-xs sm:text-sm text-[#B91C1C] italic">—</span>
  {% endif %}
</div>
