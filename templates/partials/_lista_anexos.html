<h3 class="text-sm font-medium text-[#6B7B78] mb-3">Arquivos salvos</h3>
<ul class="max-h-60 overflow-y-auto space-y-2">
  {% for anexo in anexos %}
    <li class="flex items-center justify-between gap-3 rounded-xl border border-[#E3EAE8] px-4 py-2.5 bg-[#F9FBFA]">
      <div class="min-w-0">
        <a href="{{ anexo.arquivo.url }}" target="_blank" class="block text-sm text-[#2563EB] hover:underline truncate">
          {{ anexo.nome_original }}
        </a>
        <span class="text-[10px] text-[#6B7B78]">Enviado em {{ anexo.criado_em|date:"d/m/Y H:i" }}</span>
      </div>
      
      <button type="button" class="text-[#B91C1C] hover:opacity-70 shrink-0" title="Excluir anexo"
              hx-post="{% url 'financeiro:excluir_anexo' anexo.pk %}" hx-target="#listaAnexos" hx-swap="innerHTML">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </li>
  {% empty %}
    <p class="text-sm text-[#6B7B78] text-center py-4">Nenhum documento anexado ainda.</p>
  {% endfor %}
</ul>

{% if mostrar_toast_exclusao %}
  <script>
    mostrarToast('Documento excluído.', { 
      desfazer: true, 
      urlDesfazer: '{% url "financeiro:desfazer_exclusao_anexo" %}', 
      targetDesfazer: '#listaAnexos' 
    });
  </script>
{% endif %}

{% if mostrar_toast_desfazer %}
  <script>
    mostrarToast('Documento restaurado.');
  </script>
{% endif %}
